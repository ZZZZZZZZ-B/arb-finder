profit_boost:
  default_stake: null
  default_boost_percent: null
  allow_negative_profit: true

no_sweat:
  bonus_value_ratio: 0.7

selection:
  event_discovery: true
  keyword_match_case_insensitive: true
  require_confirmation_on_multiple_matches: true

ui:
  banner_image: ./config/background.jpg
  banner_height: 120

event_window_hours: 336

sports:
  nba: { sport_key: basketball_nba, title: NBA }
  wnba: { sport_key: basketball_wnba, title: WNBA }
  nhl: { sport_key: icehockey_nhl, title: NHL }
  mlb: { sport_key: baseball_mlb, title: MLB }
  nfl: { sport_key: americanfootball_nfl, title: NFL }
  ncaaf: { sport_key: americanfootball_ncaaf, title: NCAAF }
  ufc: { sport_key: mma_mixed_martial_arts, title: UFC }
  tennis_atp: { dynamic_prefix: "tennis_atp_", title: Tennis ATP }

top_n: 10

full_game:
  core_markets: [h2h, spreads, totals]
  alt_market_prefilter:
    top_n: 20
  credit_thresholds:
    core_market: 20
    alt_market: 50
  optional_markets:
    alternate_spreads:
      title: Alternate Spread
      market_key: alternate_spreads
      sport_keys: [basketball_nba, basketball_wnba, icehockey_nhl, baseball_mlb, americanfootball_nfl, americanfootball_ncaaf]
    alternate_totals:
      title: Alternate Total
      market_key: alternate_totals
      sport_keys: [basketball_nba, basketball_wnba, icehockey_nhl, baseball_mlb, americanfootball_nfl, americanfootball_ncaaf]

periods:
  first_inning:
    title: 1st Inning
    sport_keys: [baseball_mlb]
    markets:
      run_line:
        title: Run Line
        market_key: spreads_1st_1_innings
      total_runs:
        title: Total Runs
        market_key: totals_1st_1_innings

platforms:
  draftkings:
    enabled: true
    source: odds_api
    title: DraftKings
  fanduel:
    enabled: true
    source: odds_api
    title: FanDuel
  proline:
    enabled: false
    source: odds_api
    title: Proline+
    bookmaker_key: proline_ca_on
  bet365:
    enabled: false
    source: odds_api
    title: Bet365
    bookmaker_key: bet365_au
  hardrock:
    enabled: false
    source: odds_api
    title: Hard Rock Bet
    bookmaker_key: hardrockbet

odds_api:
  api_key_envs: [ODDS_API_KEYS]
  key_rotation_strategy: round_robin
  odds_format: decimal
  date_format: iso
  bookmakers: [draftkings, fanduel, proline_ca_on, bet365_au, hardrockbet]

output:
  formats: [csv, json]
  output_dir: ./output
