profit_boost:
  default_stake: null
  default_boost_percent: null
  allow_negative_profit: true

selection:
  event_discovery: true
  keyword_match_case_insensitive: true
  require_confirmation_on_multiple_matches: true

ui:
  banner_image: ./config/background.jpg
  banner_height: 120

event_window_hours: 336

sports:
  nba: { sport_key: basketball_nba, title: NBA }
  wnba: { sport_key: basketball_wnba, title: WNBA }
  nhl: { sport_key: icehockey_nhl, title: NHL }
  mlb: { sport_key: baseball_mlb, title: MLB }
  nfl: { sport_key: americanfootball_nfl, title: NFL }
  ncaaf: { sport_key: americanfootball_ncaaf, title: NCAAF }
  ufc: { sport_key: mma_mixed_martial_arts, title: UFC }
  tennis_atp: { dynamic_prefix: "tennis_atp_", title: Tennis ATP }

top_n: 10

platforms:
  draftkings:
    enabled: true
    source: odds_api
    title: DraftKings
  fanduel:
    enabled: true
    source: odds_api
    title: FanDuel
  proline:
    enabled: false
    source: external_adapter
    title: Proline+
  bet365:
    enabled: false
    source: external_adapter
    title: Bet365
  hardrock:
    enabled: false
    source: external_adapter
    title: Hard Rock Bet

odds_api:
  api_key_envs: [ODDS_API_KEYS]
  key_rotation_strategy: round_robin
  odds_format: decimal
  date_format: iso
  bookmakers: [draftkings, fanduel]

output:
  formats: [csv, json]
  output_dir: ./output
